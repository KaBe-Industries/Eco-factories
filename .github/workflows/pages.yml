name: Deploy to GitHub Pages

# Every push to main or to any phase branch (faze-*) runs the tests,
# builds the game and publishes it to the gh-pages branch, which GitHub
# Pages serves. The latest push wins.
on:
  push:
    branches: [main, 'faze-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"
